<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Điểm Danh TSA — Cloud 24/7</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 15% 20%, rgba(225, 29, 72, 0.28), transparent 42%),
                  radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.24), transparent 45%),
                  #0b0f1a;
      color: #f8fafc; padding: 16px;
    }
    .glass-card {
      width: 100%; max-width: 430px; padding: 28px 24px; border-radius: 22px;
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 24px 55px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.32);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
      padding: 4px 12px; border-radius: 999px; background: rgba(52, 211, 153, 0.14);
      color: #34d399; border: 1px solid rgba(52, 211, 153, 0.32); margin-bottom: 14px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.2px; }
    p.sub { font-size: 13.5px; color: #94a3b8; margin-bottom: 22px; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
    input {
      width: 100%; height: 48px; border-radius: 12px; padding: 0 14px; font-size: 17px;
      letter-spacing: 1px; text-transform: uppercase; color: #fff;
      background: rgba(15, 23, 42, 0.78); border: 1px solid rgba(255,255,255,0.18);
      outline: none; transition: 0.2s;
    }
    input:focus { border-color: #f43f5e; box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.25); }
    .btn-group { display: flex; gap: 10px; margin-top: 16px; }
    .btn-sub { margin-top: 10px; }
    button {
      width: 100%; height: 45px; border-radius: 12px; border: none; font-size: 14px;
      font-weight: 700; cursor: pointer; transition: 0.2s; color: #fff;
    }
    .btn-primary {
      flex: 1.4; background: linear-gradient(135deg, #e11d48, #be123c);
      box-shadow: 0 4px 16px rgba(225, 29, 72, 0.38);
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-ghost {
      flex: 1; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16); color: #e2e8f0;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.15); }
    .btn-danger {
      height: 40px; font-size: 13px; font-weight: 600;
      background: transparent; border: 1px solid rgba(248, 113, 113, 0.3); color: #fca5a5;
    }
    .btn-danger:hover { background: rgba(248, 113, 113, 0.12); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .msg {
      margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 13.5px;
      display: none; line-height: 1.5; word-break: break-word;
    }
    .msg.ok { display: block; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.35); color: #6ee7b7; }
    .msg.err { display: block; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.35); color: #fda4af; }
    .msg.info { display: block; background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.32); color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="badge"><span class="dot"></span> Cloud Server 24/7 · Giờ VN</div>
    <h1>Auto Điểm Danh TSA</h1>
    <p class="sub">Nhập Số báo danh một lần duy nhất. Hệ thống tự động canh lịch học và điểm danh giúp bạn ngay cả khi tắt máy.</p>

    <form id="mainForm" onsubmit="event.preventDefault(); submitAction('register');">
      <label for="sbd">Số báo danh của bạn</label>
      <input type="text" id="sbd" placeholder="VD: TENNER104211" maxlength="25" autocomplete="off">

      <div class="btn-group">
        <button type="submit" class="btn-primary" data-btn>Kích hoạt Auto</button>
        <button type="button" class="btn-ghost" data-btn onclick="submitAction('status')">Kiểm tra</button>
      </div>
      <div class="btn-sub">
        <button type="button" class="btn-danger" data-btn onclick="submitAction('unregister')">Tắt & Xóa SBD khỏi hệ thống</button>
      </div>
    </form>

    <div class="msg" id="msgBox"></div>
  </div>

  <script>
    const MY_BACKEND_URL = "https://script.google.com/macros/s/AKfycbyPZUAq913bhOAC6WyKV7ufi_AxHTER-c8oLHCxtyNY562Nhr4OgLkWKjXULzANG2ziOw/exec";

    const sbdInput = document.getElementById("sbd");
    sbdInput.value = localStorage.getItem("my_auto_tsa_sbd") || "";

    function setButtonsDisabled(state) {
      document.querySelectorAll("[data-btn]").forEach(b => b.disabled = state);
    }

    function showMsg(text, type) {
      const box = document.getElementById("msgBox");
      box.textContent = text;
      box.className = "msg " + type;
    }

    async function submitAction(action) {
      const sbd = sbdInput.value.replace(/\s+/g, "").toUpperCase();
      sbdInput.value = sbd;
      if (!sbd) {
        showMsg("Vui lòng nhập Số báo danh!", "err");
        return;
      }

      setButtonsDisabled(true);
      showMsg("Đang kết nối với hệ thống...", "info");

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 20000);

      try {
        const res = await fetch(MY_BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: action, sbd: sbd }),
          signal: controller.signal
        });
        const data = await res.json();

        if (data.ok) {
          if (action === "register") localStorage.setItem("my_auto_tsa_sbd", sbd);
          if (action === "unregister") localStorage.removeItem("my_auto_tsa_sbd");
          const prefix = data.name ? `Xin chào ${data.name}! ` : "";
          showMsg(prefix + data.msg, "ok");
        } else {
          showMsg(data.msg || "Có lỗi xảy ra!", "err");
        }
      } catch (e) {
        if (e.name === "AbortError") {
          showMsg("Kết nối quá thời gian (20s). Vui lòng thử lại!", "err");
        } else {
          showMsg("Không kết nối được server. Kiểm tra mạng hoặc quyền Deploy (Anyone)!", "err");
        }
      } finally {
        clearTimeout(timeoutId);
        setButtonsDisabled(false);
      }
    }
  </script>
</body>
</html>
